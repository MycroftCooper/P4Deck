name: Optional verification skeleton

on:
  workflow_dispatch:
    inputs:
      run_p4d:
        description: Run the isolated Windows localhost p4d suite
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned package manager
        run: corepack enable
      - name: Cache Cargo downloads and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run local quick verification entry point
        run: pnpm ci:quick
      - name: Build web production bundle
        run: pnpm build

  performance:
    name: Deterministic performance gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned package manager
        run: corepack enable
      - name: Cache Cargo downloads and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-perf-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run web performance correctness gates
        run: pnpm test:perf
      - name: Run backend performance correctness gates serially
        run: pnpm test:perf:backend

  localhost-p4d:
    name: Optional isolated Windows p4d
    if: inputs.run_p4d
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated localhost p4d suite
        run: pnpm test:e2e:p4d:win
