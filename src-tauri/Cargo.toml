[package]
name = "p4deck"
default-run = "p4deck"
version = "0.1.9"
description = "A modern Helix Core desktop client"
authors = ["P4Deck contributors"]
edition = "2021"

[lib]
name = "p4deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
backend-perf = ["tokio/rt"]

[[bin]]
name = "backend-perf"
path = "src/bin/backend_perf.rs"
required-features = ["backend-perf"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "=2.3.2"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
trash = "5"
base64 = "0.22"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
similar = "2.7"
regex = "1"
zeroize = "1"
urlencoding = "2"
url = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Keep local release builds comparable with the packaged artifacts.
[profile.release]
strip = true
